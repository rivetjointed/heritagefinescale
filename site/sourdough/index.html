    .page-header {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.6rem 0.75rem 0.4rem;
      text-align: center;
    }
    .page-header h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-size: 3rem;
      line-height: 1.12;
      color: #c8a96a;
      margin: 0 0 0.25rem;
    }
    .page-header .subtitle {
      font-size: 0.95rem;
      font-style: italic;
      color: #b8a88a;
      margin: 0 0 1.25rem;
    }
    .recipe-link {
      display: inline-block;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: #c8a96a;
      border: 1px solid rgba(200,169,106,0.55);
      border-radius: 3px;
      padding: 0.6rem 1.1rem;
      transition: background 0.2s, color 0.2s;
    }
    .recipe-link:hover { background: #c8a96a; color: #1a1008; }
    @media (max-width: 460px) { .page-header h1 { font-size: 2.1rem; } }
    .gallery {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 2rem 0.75rem 3rem;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      align-items: start;
    }
    .sec-header {
      grid-column: 1 / -1;
      padding: 1.6rem 0 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .sec-header:first-child { padding-top: 0.5rem; }
    .sec-header span {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c8a96a;
      white-space: nowrap;
    }
    .sec-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(200,169,106,0.25);
    }
    .thumb {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      background: rgba(0,0,0,0.35);
    }
    .thumb img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      transition: opacity 0.15s, transform 0.15s;
    }
    .thumb:hover img { opacity: 0.78; transform: scale(1.03); }
    .thumb figcaption {
      padding: 4px 6px 6px;
      font-size: 0.65rem;
      font-style: italic;
      line-height: 1.35;
      color: #b8a88a;
    }
    @media (max-width: 720px) { .gallery { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 460px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.94);
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #lightbox.open { display: flex; }
    #lb-img {
      max-width: 88vw;
      max-height: 76vh;
      object-fit: contain;
      display: block;
      box-shadow: 0 8px 40px rgba(0,0,0,0.8);
    }
    #lb-caption {
      margin-top: 0.75rem;
      text-align: center;
      max-width: 680px;
      padding: 0 1rem;
    }
    #lb-section {
      font-family: Arial, sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c8a96a;
      display: block;
      margin-bottom: 0.3rem;
    }
    #lb-text {
      font-style: italic;
      font-size: 0.88rem;
      line-height: 1.55;
      color: #d4c4ac;
    }
    #lb-counter {
      margin-top: 0.45rem;
      font-family: Arial, sans-serif;
      font-size: 0.68rem;
      color: #555;
      letter-spacing: 0.06em;
    }
    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ccc;
      font-size: 2.2rem;
      width: 48px;
      height: 80px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      border-radius: 3px;
      transition: background 0.15s;
      user-select: none;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.15); color: #fff; }
    #lb-prev { left: 8px; }
    #lb-next { right: 8px; }
    #lb-close {
      position: fixed;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 2rem;
      cursor: pointer;
      z-index: 1002;
      padding: 4px 8px;
      line-height: 1;
    }
    #lb-close:hover { color: #fff; }
  </style>

let cur=0;
function openLb(i){cur=i;update();document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden';}
function closeLb(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
function showPrev(){cur=(cur-1+photos.length)%photos.length;update();}
function showNext(){cur=(cur+1)%photos.length;update();}
function update(){
  const p=photos[cur];
  document.getElementById('lb-img').src=p.src;
  document.getElementById('lb-section').textContent=p.section;
  document.getElementById('lb-text').textContent=p.caption;
  document.getElementById('lb-counter').textContent=(cur+1)+' / '+photos.length;
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='ArrowLeft')showPrev();
  if(e.key==='ArrowRight')showNext();
  if(e.key==='Escape')closeLb();
});
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target===document.getElementById('lightbox'))closeLb();});
let tx=0;
document.getElementById('lb-img').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('lb-img').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)dx>0?showPrev():showNext();});
</script>
