<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Backyard</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#FBFAF6;
    --panel:#F1F2EA;
    --rule:#D5D9C9;
    --hair:#E4E7DA;
    --ink:#1B1F18;
    --muted:#6A7263;
    --accent:#3F5535;
    --ember:#8C4B22;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12150E;
      --panel:#1B1F16;
      --rule:#333A2B;
      --hair:#272D20;
      --ink:#E9ECE0;
      --muted:#98A18C;
      --accent:#A8C486;
      --ember:#D9915F;
    }
  }
  :root[data-theme="dark"]{
    --paper:#12150E;
    --panel:#1B1F16;
    --rule:#333A2B;
    --hair:#272D20;
    --ink:#E9ECE0;
    --muted:#98A18C;
    --accent:#A8C486;
    --ember:#D9915F;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{
    max-width:64rem;margin:0 auto;
    padding:3rem 1.75rem 3rem;
    display:flex;flex-direction:column;gap:2.5rem;
  }

  /* ---- masthead ---- */
  .masthead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5rem}
  .mark{color:var(--accent);line-height:0}
  .mark svg{display:block}
  .kicker{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--ember);
  }
  h1{
    font-family:Fraunces,Georgia,serif;
    font-weight:500;font-size:clamp(2.2rem,6vw,3.1rem);
    line-height:1.02;margin:0;letter-spacing:-.02em;text-wrap:balance;
  }
  .rules{width:100%;max-width:50rem;display:flex;flex-direction:column;gap:2px;margin-top:.75rem}
  .rules span:first-child{height:2px;background:var(--accent);opacity:.75}
  .rules span:last-child{height:1px;background:var(--rule)}
  .hint{margin:.6rem 0 0;font-size:.9rem;color:var(--muted)}

  /* ---- galleries ---- */
  h2{
    font-family:Fraunces,Georgia,serif;
    font-weight:500;font-size:1.28rem;margin:0 0 .2rem;
    letter-spacing:-.01em;
    display:flex;align-items:baseline;gap:.75rem;
  }
  h2 .n{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-weight:400;
  }
  .h2rule{height:1px;background:var(--rule);margin:0 0 1rem}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));
    gap:.6rem;
  }
  .grid figure{margin:0}
  .grid figcaption{
    margin-top:.35rem;
    font-size:.8rem;line-height:1.35;color:var(--muted);
  }
  .grid img{
    display:block;width:100%;height:auto;
    aspect-ratio:4/3;object-fit:cover;
    background:var(--panel);
    border-radius:2px;
  }

  /* ---- panorama: a fixed-height strip that pans sideways ---- */
  .pano{
    margin:0;
    overflow-x:auto;overflow-y:hidden;
    background:var(--panel);
    border-radius:2px;
    scrollbar-width:thin;
    cursor:grab;
  }
  .pano.dragging{cursor:grabbing;user-select:none}
  .pano img{
    display:block;
    height:clamp(14rem,42vw,26rem);width:auto;max-width:none;
  }
  .pano-note{margin:.6rem 0 0;font-size:.85rem;color:var(--muted)}

  footer{
    border-top:1px solid var(--rule);
    padding-top:1.25rem;
    text-align:center;font-size:.8rem;color:var(--muted);
  }

  @media (max-width:560px){
    .sheet{padding:2rem 1rem 2.5rem;gap:2rem}
    .grid{grid-template-columns:1fr 1fr;gap:.4rem}
  }

  /* ── ATTRIBUTION (Linden Street Studio) ─────────────────────────────
     Doubled class = specificity 0,0,2,0, which outranks a host site's own
     `footer a { color: … }` (0,0,1,1) without !important. color:inherit is
     what stops this rendering as a link. No opacity — see attribution.py. */
  .lss-credit.lss-credit {
    display: inline-flex; align-items: center; gap: 0.45em;
    color: inherit; text-decoration: none;
    font-size: 0.74rem;
  }
  .lss-credit.lss-credit:visited { color: inherit; }
  .lss-credit.lss-credit:hover,
  .lss-credit.lss-credit:focus-visible {
    text-decoration: underline; text-underline-offset: 0.22em;
  }
  .lss-mark { fill: currentColor; flex: none; }
</style>
<link rel="stylesheet" href="/assets/lightbox.css">
</head>
<body>

  <section>
    <h2>The local fields <span class="n">2 photos</span></h2>
    <div class="h2rule"></div>
    <div class="grid">
      <figure><img class="zoomable" src="img/2010.jpg" width="1400" height="1050" alt="The fields" loading="lazy"><figcaption aria-hidden="true">The fields</figcaption></figure>
      <figure><img class="zoomable" src="img/2011.jpg" width="1400" height="1050" alt="The path along the fields" loading="lazy"><figcaption aria-hidden="true">The path along the fields</figcaption></figure>

  <section>

    <div class="h2rule"></div>

</div>
<script>
  // Mouse drag pans the panorama strip (touch and trackpads scroll it natively).
  // A real drag swallows the click that follows, so letting go after panning
  // does not open the viewer.
  (function () {
    var strip = document.querySelector(".pano");
    if (!strip) return;
    var down = false, moved = false, startX = 0, startLeft = 0;
    strip.addEventListener("mousedown", function (e) {
      if (e.button !== 0) return;
      down = true; moved = false; startX = e.clientX; startLeft = strip.scrollLeft;
      e.preventDefault();
    });
    window.addEventListener("mousemove", function (e) {
      if (!down) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 4) { moved = true; strip.classList.add("dragging"); }
      strip.scrollLeft = startLeft - dx;
    });
    window.addEventListener("mouseup", function () {
      down = false; strip.classList.remove("dragging");
    });
    strip.addEventListener("click", function (e) {
      if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);
  })();
</script>

</body>
